services:
  db:
    image: postgres
    restart: always
    ports:
      - '5432:5432'
    environment:
      POSTGRES_PASSWORD: pass123

  test-db:
    image: postgres
    restart: always
    ports:
      - '5433:5432'
    environment:
      POSTGRES_PASSWORD: pass123

  redis:
    image: redis:latest
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data
    environment:
      - REDIS_PASSWORD=!Testing123
      - REDIS_PORT=6379
      - REDIS_DATABASES=16

volumes:
  redis_data:
